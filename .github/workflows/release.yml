name: Release

# Release checklist: the install examples pin a concrete version. Before
# pushing a new tag, update VERSION= in:
#   README.md, README.zh-CN.md, docs/getting-started.md, docs/zh-CN/getting-started.md
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish static linux/amd64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install static build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libcap-dev libsystemd-dev libdbus-1-dev \
            libibverbs-dev libnl-3-dev libnl-route-3-dev pkg-config

      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: make build-static VERSION="${GITHUB_REF_NAME}"

      - name: Verify version
        run: test "$(./clab-tui --version)" = "clab-tui version ${GITHUB_REF_NAME}"

      - name: Package
        run: |
          set -eu
          ver="${GITHUB_REF_NAME}"
          name="clab-tui_${ver}_linux_amd64"
          mkdir -p "dist/${name}"
          cp clab-tui README.md README.zh-CN.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > checksums.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/clab-tui_*_linux_amd64.tar.gz
            dist/checksums.txt
